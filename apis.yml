name: Shelf Engine
description: 'Shelf Engine was a Seattle-based technology company that used machine
  learning and AI-driven demand forecasting to help grocery retailers reduce food
  waste and optimize ordering of perishable and fresh food items. It offered a guaranteed-order
  model where its forecasting engine predicted demand and absorbed the risk of unsold
  inventory. Shelf Engine was acquired by / merged into Crisp (gocrisp.com), the retail
  data platform, and its independent brand is now defunct: shelfengine.com 301-redirects
  to gocrisp.com. No independent public API, developer portal, SDKs, or OpenAPI surface
  is published under the Shelf Engine brand.'
